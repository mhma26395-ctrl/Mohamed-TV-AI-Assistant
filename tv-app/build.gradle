plugins { id 'com.android.application' }

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

android {
    namespace 'com.tvai.assistant'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tvai.assistant.next'
        minSdk 26
        targetSdk 28
        versionCode 22
        versionName '0.6.2-rollback'
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'tvai-debug'
            keyPassword 'android'
        }
    }
    signingConfigs {
        release {
            def storePath = System.getenv('RELEASE_STORE_FILE')
            def storePass = System.getenv('RELEASE_STORE_PASSWORD')
            def keyAliasValue = System.getenv('RELEASE_KEY_ALIAS')
            def keyPass = System.getenv('RELEASE_KEY_PASSWORD')
            if (storePath && storePass && keyAliasValue && keyPass) {
                storeFile file(storePath)
                storePassword storePass
                keyAlias keyAliasValue
                keyPassword keyPass
            }
        }
    }
    lint {
        // This sideloaded rollback build intentionally preserves the legacy target SDK.
        disable += 'ExpiredTargetSdkVersion'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
