plugins { id 'com.android.application' }

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

android {
    namespace 'com.tvai.assistant'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tvai.assistant'
        minSdk 26
        targetSdk 28
        versionCode 14
        versionName '0.6.2'
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'tvai-debug'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
