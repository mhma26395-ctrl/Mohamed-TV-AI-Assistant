plugins { id 'com.android.application' }

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

android {
    namespace 'com.tvai.assistant'
    compileSdk 35
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId 'com.tvai.assistant.next'
        minSdk 26
        targetSdk 34
        versionCode 21
        versionName '0.6.9'
        buildConfigField 'String', 'BACKEND_BASE_URL', '"https://mohamed-tv-ai-backend.mhma26395.workers.dev"'
    }
    buildTypes {
        debug {
            // Personal test build installs beside the public app and uses isolated staging backend.
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            buildConfigField 'String', 'BACKEND_BASE_URL', '"https://mohamed-tv-ai-backend-staging.mhma26395.workers.dev"'
        }
    }
}
