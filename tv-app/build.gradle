plugins { id 'com.android.application' }

android {
    namespace 'com.tvai.assistant'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tvai.assistant'
        minSdk 23
        targetSdk 28
        versionCode 5
        versionName '0.2.2'
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'tvai-debug'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
