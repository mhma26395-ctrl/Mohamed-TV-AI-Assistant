name = "mohamed-tv-ai-backend"
main = "worker.js"
compatibility_date = "2026-11-10"

[vars]
# Model ID is configurable without changing the Android app.
# This is the selected starting model; confirm the account's free-tier quota before public use.
GROQ_MODEL = "openai/gpt-oss-120b"

# Configure encrypted Worker secrets only; never commit values:
# wrangler secret put SESSION_SIGNING_SECRET
# wrangler secret put GROQ_API_KEY
# wrangler secret put DEVICE_ADMIN_SECRET
#
# Configure ENROLL_LIMITER, RATE_LIMITER, and DEVICE_RATE_LIMITER as
# Cloudflare Rate Limiting bindings in the Worker dashboard:
# ENROLL_LIMITER, RATE_LIMITER, DEVICE_RATE_LIMITER, ADMIN_LIMITER.
# Do not deploy until all four bindings and all three secrets are configured.

[[durable_objects.bindings]]
name = "AUTH_CHALLENGES"
class_name = "AuthChallengeStore"

[[durable_objects.bindings]]
name = "AUTH_DEVICES"
class_name = "AuthDeviceStore"

[[migrations]]
tag = "auth-v1"
new_sqlite_classes = ["AuthChallengeStore", "AuthDeviceStore"]
