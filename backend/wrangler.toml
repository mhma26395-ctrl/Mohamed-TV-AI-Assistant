name = "mohamed-tv-ai-backend"
main = "worker.js"
compatibility_date = "2026-11-10"

[vars]
# Model ID is configurable without changing the Android app.
# This is the selected starting model; confirm the account's free-tier quota before public use.
GROQ_MODEL = "openai/gpt-oss-120b"

# Configure encrypted Worker secrets only; never commit values:
# wrangler secret put SESSION_SIGNING_SECRET
# wrangler secret put GROQ_API_KEY
# wrangler secret put DEVICE_ADMIN_SECRET
#
# Rate-limit namespace IDs must be unique within your Cloudflare account.
# These are starter IDs; change them if any are already used by another Worker.
# Cloudflare's Worker Rate Limiting API supports approximate 10s or 60s windows,
# local to each Cloudflare location (not a strict worldwide/global ceiling).
[[ratelimits]]
name = "ENROLL_LIMITER"
namespace_id = "7401101"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "7401102"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "DEVICE_RATE_LIMITER"
namespace_id = "7401103"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "7401104"
simple = { limit = 10, period = 60 }

# Do not deploy until all bindings and all three secrets are configured.

[[durable_objects.bindings]]
name = "AUTH_CHALLENGES"
class_name = "AuthChallengeStore"

[[durable_objects.bindings]]
name = "AUTH_DEVICES"
class_name = "AuthDeviceStore"

[[durable_objects.bindings]]
name = "SECURITY_EVENTS"
class_name = "SecurityEventStore"

[[migrations]]
tag = "auth-v1"
new_sqlite_classes = ["AuthChallengeStore", "AuthDeviceStore"]

[[migrations]]
tag = "security-telemetry-v1"
new_sqlite_classes = ["SecurityEventStore"]

# Isolated staging Worker. Bindings and vars are repeated because Wrangler
# environments do not inherit them. Secrets must be added separately with --env staging.
[env.staging]
workers_dev = true

[env.staging.vars]
GROQ_MODEL = "openai/gpt-oss-120b"

[[env.staging.ratelimits]]
name = "ENROLL_LIMITER"
namespace_id = "7401201"
simple = { limit = 5, period = 60 }

[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "7401202"
simple = { limit = 30, period = 60 }

[[env.staging.ratelimits]]
name = "DEVICE_RATE_LIMITER"
namespace_id = "7401203"
simple = { limit = 15, period = 60 }

[[env.staging.ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "7401204"
simple = { limit = 5, period = 60 }

[[env.staging.durable_objects.bindings]]
name = "AUTH_CHALLENGES"
class_name = "AuthChallengeStore"

[[env.staging.durable_objects.bindings]]
name = "AUTH_DEVICES"
class_name = "AuthDeviceStore"

[[env.staging.durable_objects.bindings]]
name = "SECURITY_EVENTS"
class_name = "SecurityEventStore"

[[env.staging.migrations]]
tag = "auth-staging-v1"
new_sqlite_classes = ["AuthChallengeStore", "AuthDeviceStore"]

[[env.staging.migrations]]
tag = "security-telemetry-staging-v1"
new_sqlite_classes = ["SecurityEventStore"]

# Cloudflare Workers Builds runs `wrangler preview` for pull-request branches.
# Keep this empty until isolated Preview bindings and secrets are provisioned;
# never inherit or point Preview traffic at production resources.
previews = { }
