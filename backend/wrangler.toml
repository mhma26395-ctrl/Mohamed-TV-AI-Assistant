name = "mohamed-tv-ai-backend"
main = "worker.js"
compatibility_date = "2026-11-10"

[vars]
GEMINI_MODEL = "gemini-2.5-flash"

# Configure these as encrypted Worker secrets, never as plain vars:
# wrangler secret put GEMINI_API_KEY
# wrangler secret put APP_ACCESS_TOKEN
#
# Configure a Cloudflare Rate Limiting binding named RATE_LIMITER
# in the Worker dashboard before exposing the endpoint.
