name: Build and publish signed Mohamed TV AI Assistant release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate existing production signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing RELEASE_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing RELEASE_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing RELEASE_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing RELEASE_KEY_PASSWORD" && exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare production signing identity
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mohamed-tv-release.jks"
          chmod 600 "$RUNNER_TEMP/mohamed-tv-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/mohamed-tv-release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build production APK from current main
        run: gradle assembleRelease

      - name: Locate and verify new APK signature
        run: |
          APK_PATH=$(find tv-app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK_PATH"
          test -s "$APK_PATH"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK_PATH"
          mkdir -p dist
          cp "$APK_PATH" dist/Mohamed-TV-AI-Assistant-0.7.0.apk
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

      - name: Compare package and signing certificate with published production APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p old
          gh release download v0.6.9 --repo "$GITHUB_REPOSITORY" --pattern tv-app-release.apk --dir old
          OLD_APK=old/tv-app-release.apk
          NEW_APK=dist/Mohamed-TV-AI-Assistant-0.7.0.apk
          test -s "$OLD_APK"
          "$APKSIGNER" verify --verbose "$OLD_APK"
          OLD_CERT=$("$APKSIGNER" verify --print-certs "$OLD_APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$NEW_APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          test -n "$OLD_CERT" && test "$OLD_CERT" = "$NEW_CERT" || (echo "Signing certificate mismatch; refusing publication" && exit 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          OLD_PACKAGE=$("$AAPT" dump badging "$OLD_APK" | sed -n "1s/^package: name='\\([^']*\\)'.*/\\1/p")
          NEW_PACKAGE=$("$AAPT" dump badging "$NEW_APK" | sed -n "1s/^package: name='\\([^']*\\)'.*/\\1/p")
          test -n "$OLD_PACKAGE" && test "$OLD_PACKAGE" = "$NEW_PACKAGE" || (echo "Application ID mismatch; refusing publication" && exit 1)
          OLD_CODE=$("$AAPT" dump badging "$OLD_APK" | sed -n "1s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")
          NEW_CODE=$("$AAPT" dump badging "$NEW_APK" | sed -n "1s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")
          test "$NEW_CODE" -gt "$OLD_CODE" || (echo "New versionCode must be greater than the published version" && exit 1)
          echo "Verified same package, same production signer, and higher versionCode."

      - name: Generate checksum and release notes
        run: |
          sha256sum dist/Mohamed-TV-AI-Assistant-0.7.0.apk | tee dist/SHA256SUMS.txt
          cat > dist/RELEASE_NOTES.md <<'EOF'
          # Mohamed TV AI Assistant 0.7.0

          Built from the latest main branch after the tested compact-window navigation and local-command fixes.

          The APK is signed with the existing production signing identity. Publication is gated by checks that its application ID and signing certificate match the previously published APK, and that its versionCode is higher.

          ## Installation
          Download Mohamed-TV-AI-Assistant-0.7.0.apk from the Assets section.

          ## Compatibility
          Android TV / Google TV devices running Android 8.0 or later. Device firmware and granted permissions may affect individual features.
          EOF

      - name: Create release and upload verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.7.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.7.0 --repo "$GITHUB_REPOSITORY" --target main --title "Mohamed TV AI Assistant 0.7.0" --notes-file dist/RELEASE_NOTES.md
          else
            gh release edit v0.7.0 --repo "$GITHUB_REPOSITORY" --title "Mohamed TV AI Assistant 0.7.0" --notes-file dist/RELEASE_NOTES.md
          fi
          gh release upload v0.7.0 dist/Mohamed-TV-AI-Assistant-0.7.0.apk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
