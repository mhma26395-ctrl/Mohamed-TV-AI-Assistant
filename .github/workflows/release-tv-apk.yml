name: Build signed Mohamed TV AI Assistant release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing RELEASE_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing RELEASE_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing RELEASE_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing RELEASE_KEY_PASSWORD" && exit 1)

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: restore/pre-device-auth

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare signing identity
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mohamed-tv-release.jks"
          chmod 600 "$RUNNER_TEMP/mohamed-tv-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/mohamed-tv-release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Confirm legacy app source is present
        run: test -s tv-app/src/main/java/com/tvai/assistant/MainActivity.java

      - name: Build signed production APK
        run: gradle assembleRelease

      - name: Locate release APK
        run: |
          APK_PATH=$(find tv-app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK_PATH"
          test -s "$APK_PATH"
          echo "RELEASE_APK=$APK_PATH" >> "$GITHUB_ENV"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$RELEASE_APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohamed-TV-AI-Assistant-pre-device-auth-rollback
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error
          retention-days: 30
