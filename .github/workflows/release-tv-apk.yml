name: Build and verify latest signed Mohamed TV AI Assistant release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-tv-apk.yml'
      - 'tv-app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate signing secrets without exposing values
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing RELEASE_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing RELEASE_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing RELEASE_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing RELEASE_KEY_PASSWORD" && exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare signing identity
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mohamed-tv-release.jks"
          chmod 600 "$RUNNER_TEMP/mohamed-tv-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/mohamed-tv-release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/mohamed-tv-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Check production package identity and version
        run: |
          grep -q "applicationId 'com.tvai.assistant.next'" tv-app/build.gradle
          grep -q "versionCode 22" tv-app/build.gradle
          grep -q "versionName '0.7.0'" tv-app/build.gradle

      - name: Build signed production APK from main
        run: gradle assembleRelease

      - name: Verify APK signature, package, version and old signer compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_PATH="tv-app/build/outputs/apk/release/tv-app-release.apk"
          test -s "$APK_PATH"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose "$APK_PATH"
          "$AAPT" dump badging "$APK_PATH" | grep -q "package: name='com.tvai.assistant.next' versionCode='22' versionName='0.7.0'"
          mkdir -p dist
          curl --fail --location --silent --show-error \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v0.6.9/tv-app-release.apk" \
            --output dist/previous-release.apk
          test -s dist/previous-release.apk
          OLD_CERT=$("$APKSIGNER" verify --print-certs dist/previous-release.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$APK_PATH" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          test -n "$OLD_CERT"
          test -n "$NEW_CERT"
          if [ "$OLD_CERT" != "$NEW_CERT" ]; then
            echo "Signer certificate mismatch. The existing Release will NOT be replaced."
            exit 1
          fi
          cp "$APK_PATH" dist/Mohamed-TV-AI-Assistant-0.7.0.apk
          sha256sum dist/Mohamed-TV-AI-Assistant-0.7.0.apk | tee dist/SHA256SUMS.txt
          cp dist/Mohamed-TV-AI-Assistant-0.7.0.apk dist/tv-app-release.apk
          echo "Package, version and signing certificate checks passed."

      - name: Upload verified APK for final release publication
        uses: actions/upload-artifact@v4
        with:
          name: Mohamed-TV-AI-Assistant-0.7.0-signed-verified
          path: |
            dist/Mohamed-TV-AI-Assistant-0.7.0.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified APK to the existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v0.6.9 \
            dist/tv-app-release.apk#Mohamed-TV-AI-Assistant-0.7.0.apk \
            dist/SHA256SUMS.txt \
            --clobber
          cat > dist/release-notes.md <<'EOF'
          # Mohamed TV AI Assistant 0.7.0

          Built from the latest `main` branch and signed with the same production certificate as the previous release. Package identity and upgrade-signature compatibility were verified before publication.

          ## Installation
          Download `tv-app-release.apk` from the Assets section and install it over the existing app. Your app data should remain intact when Android accepts the matching signature.

          ## Version
          - Version name: 0.7.0
          - Version code: 22
          - Package: `com.tvai.assistant.next`
          EOF
          gh release edit v0.6.9 \
            --title "Mohamed TV AI Assistant 0.7.0" \
            --notes-file dist/release-notes.md
