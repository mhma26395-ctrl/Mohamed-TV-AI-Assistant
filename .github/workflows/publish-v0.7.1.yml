name: Build and publish Mohamed TV AI Assistant 0.7.2

on:
  push:
    branches: [main]
    paths:
      - 'tv-app/src/main/java/com/tvai/assistant/MainActivity.java'
      - 'tv-app/build.gradle'
      - '.github/workflows/publish-v0.7.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate production signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Configure production signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Verify declared app identity and version
        run: |
          grep -q "applicationId 'com.tvai.assistant.next'" tv-app/build.gradle
          grep -q "versionCode 24" tv-app/build.gradle
          grep -q "versionName '0.7.2'" tv-app/build.gradle
          grep -q "VV4EEWFUZ8FCU" tv-app/src/main/java/com/tvai/assistant/MainActivity.java

      - name: Build signed release APK
        run: gradle assembleRelease

      - name: Verify package, version and compatibility with previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="tv-app/build/outputs/apk/release/tv-app-release.apk"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.tvai.assistant.next' versionCode='23' versionName='0.7.2'"
          mkdir -p dist previous
          gh release download v0.7.1 --repo "$GITHUB_REPOSITORY" --pattern 'Mohamed-TV-AI-Assistant-0.7.1.apk' --dir previous
          OLD="previous/Mohamed-TV-AI-Assistant-0.7.1.apk"
          test -s "$OLD"
          "$APKSIGNER" verify --verbose "$OLD"
          OLD_CERT=$("$APKSIGNER" verify --print-certs "$OLD" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          test -n "$OLD_CERT" && test "$OLD_CERT" = "$NEW_CERT" || (echo "Production signing certificate mismatch; refusing publication." && exit 1)
          cp "$APK" dist/Mohamed-TV-AI-Assistant-0.7.2.apk
          sha256sum dist/Mohamed-TV-AI-Assistant-0.7.2.apk | tee dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mohamed-TV-AI-Assistant-0.7.2-production
          path: |
            dist/Mohamed-TV-AI-Assistant-0.7.2.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish separate v0.7.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > dist/RELEASE_NOTES.md <<'EOF'
          # Mohamed TV AI Assistant 0.7.2

          This is a separate release. Previous releases remain available.

          ## What's new
          - Fixed live currency routing for EUR to EGP and Saudi Arabia time-zone recognition.
          - Fixed sports date validation that rejected valid match requests.
          - Added retry handling for temporary sports feed failures and normalized common Arabic voice-recognition variants.
          - Built as a production APK with the existing production signing certificate.

          ## Compatibility
          Android TV / Google TV, Android 8.0 or later.

          ## Upgrade
          Install over v0.7.1. The build is published only after the application ID and production signing certificate are verified.
          EOF
          gh release create v0.7.2 --repo "$GITHUB_REPOSITORY" --target main --title "Mohamed TV AI Assistant 0.7.2" --notes-file dist/RELEASE_NOTES.md
          gh release upload v0.7.2 dist/Mohamed-TV-AI-Assistant-0.7.2.apk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
