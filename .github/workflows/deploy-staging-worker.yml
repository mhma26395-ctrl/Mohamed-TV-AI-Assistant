name: Deploy Mohamed TV AI Assistant Worker (Staging only)

on:
  push:
    branches:
      - feature/deepseek-staging-apk
    paths:
      - "backend/**"
      - ".github/workflows/deploy-staging-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/feature/deepseek-staging-apk'
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Staging branch only
        uses: actions/checkout@v4
        with:
          ref: feature/deepseek-staging-apk

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required encrypted deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_DEEPSEEK_API_KEY: ${{ secrets.STAGING_DEEPSEEK_API_KEY }}
          STAGING_SESSION_SIGNING_SECRET: ${{ secrets.STAGING_SESSION_SIGNING_SECRET }}
          STAGING_DEVICE_ADMIN_SECRET: ${{ secrets.STAGING_DEVICE_ADMIN_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$STAGING_DEEPSEEK_API_KEY" || { echo "Missing STAGING_DEEPSEEK_API_KEY"; exit 1; }
          test -n "$STAGING_SESSION_SIGNING_SECRET" || { echo "Missing STAGING_SESSION_SIGNING_SECRET"; exit 1; }
          test "${#STAGING_SESSION_SIGNING_SECRET}" -ge 32 || { echo "STAGING_SESSION_SIGNING_SECRET must be at least 32 characters"; exit 1; }
          test -n "$STAGING_DEVICE_ADMIN_SECRET" || { echo "Missing STAGING_DEVICE_ADMIN_SECRET"; exit 1; }
          test "${#STAGING_DEVICE_ADMIN_SECRET}" -ge 32 || { echo "STAGING_DEVICE_ADMIN_SECRET must be at least 32 characters"; exit 1; }

      - name: Check Worker syntax and tests
        run: |
          npm run check
          npm test

      - name: Deploy isolated Staging Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --env staging --config wrangler.toml

      - name: Set encrypted Staging Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_DEEPSEEK_API_KEY: ${{ secrets.STAGING_DEEPSEEK_API_KEY }}
          STAGING_SESSION_SIGNING_SECRET: ${{ secrets.STAGING_SESSION_SIGNING_SECRET }}
          STAGING_DEVICE_ADMIN_SECRET: ${{ secrets.STAGING_DEVICE_ADMIN_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$STAGING_DEEPSEEK_API_KEY" | npx --yes wrangler@4 secret put DEEPSEEK_API_KEY --env staging --config wrangler.toml
          printf '%s' "$STAGING_SESSION_SIGNING_SECRET" | npx --yes wrangler@4 secret put SESSION_SIGNING_SECRET --env staging --config wrangler.toml
          printf '%s' "$STAGING_DEVICE_ADMIN_SECRET" | npx --yes wrangler@4 secret put DEVICE_ADMIN_SECRET --env staging --config wrangler.toml

      - name: Verify Staging health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            https://mohamed-tv-ai-backend-staging.mhma26395.workers.dev/v1/health \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(j.ok!==true||j.provider!=="deepseek")process.exit(1);console.log("Staging health verified; provider="+j.provider)})'
