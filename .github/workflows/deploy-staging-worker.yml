name: Deploy Mohamed TV AI backend - STAGING ONLY

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mohamed-tv-ai-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/deepseek-staging-apk

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        working-directory: backend
        run: npm install --no-save wrangler

      - name: Validate staging configuration (dry run)
        working-directory: backend
        run: npx wrangler deploy --dry-run --env staging --config wrangler.toml

      - name: Deploy staging Worker only
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --env staging --config wrangler.toml
