name: Backend security source checks

on:
  push:
    branches: [main, test/compact-scroll-fix]
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  workflow_dispatch:

jobs:
  worker-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: npm run check
      - name: Run authentication storage tests
        run: npm test
      - name: Install Wrangler CLI
        run: npm install --no-save wrangler
      - name: Validate default Worker bundle and Durable Object configuration (dry run only)
        run: npx wrangler deploy --dry-run --config wrangler.toml
      - name: Validate isolated staging Worker configuration (dry run only)
        run: npx wrangler deploy --dry-run --env staging --config wrangler.toml
