name: Build Mohamed TV AI Assistant APK
on:
  push:
    branches: [main, 'fix/compact-scroll-and-local-dev-settings', 'feature/deepseek-staging-apk']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend syntax
        run: npm --prefix backend run check
      - name: Run backend tests
        run: npm --prefix backend test
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Verify APK output and staging identity
        run: |
          test -s tv-app/build/outputs/apk/debug/tv-app-debug.apk
          aapt dump badging tv-app/build/outputs/apk/debug/tv-app-debug.apk | grep -q "package: name='com.tvai.assistant.next.staging'"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohamed-TV-AI-Assistant-0.7.0-DeepSeek-Staging
          path: tv-app/build/outputs/apk/debug/tv-app-debug.apk
          if-no-files-found: error
          retention-days: 14
