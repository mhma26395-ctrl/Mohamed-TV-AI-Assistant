name: Deploy and verify Mohamed TV AI backend - PRODUCTION

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mohamed-tv-ai-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        working-directory: backend
        run: npm install --no-save wrangler
      - name: Run backend checks
        working-directory: backend
        run: |
          npm run check
          npm test
      - name: Validate production Worker bundle (dry run)
        working-directory: backend
        run: npx wrangler deploy --dry-run --config wrangler.toml
      - name: Deploy production Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config wrangler.toml
      - name: Verify production health and DeepSeek readiness
        env:
          HEALTH_URL: https://mohamed-tv-ai-backend.mhma26395.workers.dev/v1/health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$HEALTH_URL" -o health.json; then
              break
            fi
            sleep 5
          done
          test -s health.json
          cat health.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          if (h.provider !== 'deepseek') throw new Error(`Wrong provider: ${h.provider}`);
          if (h.ok !== true) throw new Error(`Production readiness failed. Missing: ${(h.missing || []).join(', ')}`);
          if (!h.readiness || Object.values(h.readiness).some(v => v !== true)) {
            throw new Error('One or more production readiness checks are false');
          }
          console.log('Production health verified: DeepSeek is configured and required bindings/secrets are present.');
          NODE
