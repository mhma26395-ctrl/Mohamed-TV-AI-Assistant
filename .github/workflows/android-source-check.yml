name: Android source checks (no APK)
on:
  push:
    branches: [main]
    paths:
      - 'tv-app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-source-check.yml'
  pull_request:
    paths:
      - 'tv-app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-source-check.yml'
permissions:
  contents: read
jobs:
  android-source-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android Java sources (no APK)
        run: gradle :tv-app:compileDebugJavaWithJavac
      - name: Run Android lint (no APK)
        run: gradle :tv-app:lintDebug
